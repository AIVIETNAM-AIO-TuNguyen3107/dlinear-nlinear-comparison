[project]
name = "dlinear-nlinear-comparison"
version = "0.1.0"
description = "When does DLinear beat NLinear? Data-characteristic-driven LTSF comparison."
readme = "WEEK01_Outline.md"
requires-python = ">=3.10"
authors = [
  { name = "AIVIETNAM-AIO-TuNguyen3107", email = "tunm360481@gmail.com" },
]
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "statsmodels",
  "scikit-learn",
  "matplotlib",
  "yfinance",
]

[project.optional-dependencies]
dev = [
  "jupyter",
  "ipykernel",
  "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["test_src"]
pythonpath = ["."]
